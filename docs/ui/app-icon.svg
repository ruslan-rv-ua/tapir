<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Tapir App Icon — Radio Waves (from logo, without tapir face) -->
  <!-- Background: dark teal from logo palette (#164d69) -->
  <rect width="512" height="512" rx="108" fill="#164d69"/>
  <!-- Emission dot (white for contrast on dark background) -->
  <circle cx="128" cy="256" r="28" fill="#fff"/>
  <!-- Inner arc — orange (#ea7044 from logo) -->
  <path d="M196 182 A100 100 0 0 1 196 330" stroke="#ea7044" stroke-width="34" stroke-linecap="round" fill="none"/>
  <!-- Middle arc — amber (#f39c3e from logo) -->
  <path d="M254 119 A186 186 0 0 1 254 393" stroke="#f39c3e" stroke-width="34" stroke-linecap="round" fill="none"/>
  <!-- Outer arc — light teal (#5bc0c4, lightened for contrast on dark bg) -->
  <path d="M309 58 A268 268 0 0 1 309 454" stroke="#5bc0c4" stroke-width="34" stroke-linecap="round" fill="none"/>
</svg>
