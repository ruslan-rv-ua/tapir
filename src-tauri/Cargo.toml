[package]
name = "tapir"
version = "0.1.0"
description = "Accessible Internet Radio Recorder for Windows"
edition = "2024"

[lib]
name = "tapir_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tauri Plugins (Phase 1 only)
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

# CLI argument parsing (Phase 3G). Pure-Rust, no C deps; derive adds the
# clap_derive proc-macro (build-time only). try_parse_from is used so clap
# never auto-prints to the (absent) release console — see cli.rs.
clap = { version = "4", features = ["derive"] }

# HTTP Streaming
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls", "json"] }
icy-metadata = { version = "0.6", features = ["reqwest"] }
stream-download = { version = "0.24", features = ["reqwest-rustls"] }

# Tags
lofty = "0.24"

# Audio playback
rodio = { version = "0.22", default-features = false, features = [
    "playback",
    "symphonia-mp3",
    "symphonia-aac",
    "symphonia-isomp4",
] }
cpal = "0.15"
rtrb = "0.3"
# Direct symphonia access for LiveSource decoder
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4"] }

# Async
tokio = { version = "~1.51", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
futures-util = "0.3"
bytes = "1"

# Logging
log = "0.4"

# Errors
anyhow = "1"
thiserror = "2"

# Unicode
unicode-normalization = "0.1"
# cp1251 fallback for legacy Winamp/SHOUTcast playlists on import
encoding_rs = "0.8"

# Misc
nanoid = "0.4"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
sys-locale = "0.3"

# Win32 APIs for quit-confirm MessageBox, Shell file operations
# (Recycle Bin delete via SHFileOperationW, "open with the associated app" via
# ShellExecuteW — which needs Com for its STA init) and the SMTC media session
# (WinRT Media + interop, see src/smtc.rs).
windows = { version = "0.62", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_WinRT",
    "Media",
    "Foundation",
] }

# Registry access for one-shot AppUserModelID registration at startup,
# so toast notifications carry our AUMID and actually appear on Windows 10/11.
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
chrono-tz = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
strip = false
panic = "unwind"
